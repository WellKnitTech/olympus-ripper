name: Windows CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    name: Windows clean-VM smoke tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package on clean Windows VM (PowerShell)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile package
        shell: pwsh
        run: python -m compileall olympus_ripper

      - name: Run fixture-based tests
        shell: pwsh
        run: python -m pytest -q

      - name: PowerShell smoke test plugin discovery
        shell: pwsh
        run: |
          oripper --quiet --no-color list
          oripper --quiet --no-color list --platform windows
          oripper --quiet --no-color list --platform macos
          python -m olympus_ripper.cli --quiet --no-color list

      - name: cmd.exe smoke test plugin discovery
        shell: cmd
        run: |
          oripper --quiet --no-color list
          oripper --quiet --no-color list --platform windows
          oripper --quiet --no-color list --platform macos
          python -m olympus_ripper.cli --quiet --no-color list
