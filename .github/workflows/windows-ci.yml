name: Windows CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    name: Windows smoke tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile package
        run: python -m compileall olympus_ripper

      - name: Smoke test plugin discovery
        run: |
          oripper --quiet list
          oripper --quiet list --platform windows
          oripper --quiet list --platform macos

      - name: Smoke test module entry point
        run: python -m olympus_ripper.cli --quiet list
